<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galactic Boss Fight</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <span>PLAYER HP: <strong id="playerHp">100</strong></span>
      <span>BOSS HP: <strong id="bossHp">300</strong></span>
      <span>STATE: <strong id="gameState">MENU (Normal)</strong></span>
    </div>
    <canvas id="gameCanvas" width="600" height="650"></canvas>
    <div class="controls-bar">
      [1/2/3] Select Difficulty &nbsp;|&nbsp; [← / →] Move &nbsp;|&nbsp; [SPACE] Shoot &nbsp;|&nbsp; [R] Restart &nbsp;|&nbsp; [M] Menu
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
